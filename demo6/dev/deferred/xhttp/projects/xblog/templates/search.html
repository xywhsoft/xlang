<!doctype html>
<html>
<head><meta charset="utf-8"><title>Search - xBlog</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
<h1>xBlog</h1>
<nav><a href="/">Home</a> | <a href="/archive">Archive</a> | <a href="/api/posts">JSON API</a></nav>
</header>
<main>
<h2>Search: &quot;{$query}&quot;</h2>
{#if:hasPosts}
<ul class="posts">
{#foreach:posts}
<li><a href="/post/{$slug}">{$title}</a><small>{$date}</small></li>
{#end}
</ul>
{#else}
<p>No matches.</p>
{#end}
</main>
<footer><small>Powered by xlang xblog</small></footer>
</body>
</html>
