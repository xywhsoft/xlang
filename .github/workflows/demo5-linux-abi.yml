name: demo5 linux abi

on:
  push:
    paths:
      - "demo5/**"
      - ".github/workflows/demo5-linux-abi.yml"
  pull_request:
    paths:
      - "demo5/**"
      - ".github/workflows/demo5-linux-abi.yml"
  workflow_dispatch:

jobs:
  linux-gcc-abi-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex lemon

      - name: Build demo5 and run ABI smoke tests
        run: |
          chmod +x demo5/build_gcc.sh
          demo5/build_gcc.sh
