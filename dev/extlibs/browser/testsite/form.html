<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form controls</title>
</head>
<body>
	<h1>Form controls</h1>
	<label for="name-input">Name</label>
	<input id="name-input" name="name" placeholder="Name" autocomplete="off">
	<label>
		<input id="agree-check" type="checkbox">
		Agree
	</label>
	<select id="choice-select">
		<option value="a">A</option>
		<option value="b">B</option>
	</select>
	<button id="disabled-button" type="button" disabled>Disabled first</button>
	<script>
		setTimeout(function () {
			document.getElementById("disabled-button").disabled = false;
		}, 250);
	</script>
</body>
</html>
