<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dynamic controls</title>
</head>
<body>
	<h1>Dynamic controls</h1>
	<div id="mount"></div>
	<script>
		setTimeout(function () {
			var button = document.createElement("button");
			button.id = "delayed-button";
			button.type = "button";
			button.textContent = "Delayed";
			button.addEventListener("click", function () {
				document.body.setAttribute("data-clicked", "yes");
			});
			document.getElementById("mount").appendChild(button);
		}, 250);
	</script>
</body>
</html>
